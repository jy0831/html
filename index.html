function eligible(s){return reasons(s).length===0}
function reviewStatus(s){if(s.status==='paid')return ['지급 완료','ok'];if(s.status==='reserved'){const b=store.batches.find(b=>b.id===s.reservation);const g=b?.groups.find(g=>g.ids.includes(s.id));return g?.status==='unknown'?['결과 미확인','warn']:['이체 결과 대기','info']}if(s.hold)return ['지급 보류','warn'];if(eligible(s))return ['지급 가능','ok'];return ['확인 필요','warn']}
function allowedFilter(s,f){if(f==='eligible')return eligible(s);if(f==='needs')return s.status==='unpaid'&&!eligible(s)&&!s.hold;if(f==='hold')return s.status==='unpaid'&&!!s.hold;if(f==='reserved')return s.status==='reserved';if(f==='paid')return s.status==='paid';if(f==='approval')return !s.approved&&s.status==='unpaid';return true}

function visibleRows(){const all=filteredRows();ui.page=Math.max(1,Math.min(ui.page,Math.ceil(all.length/ui.pageSize)||1));return all.slice((ui.page-1)*ui.pageSize,ui.page*ui.pageSize)}

function bStatus(b){let s=batchStats(b);if(s.unknown.length)return ['일부 이체·미확인','warn'];if(s.pending.length)return ['은행 결과 대기','info'];if(s.failed.length&&s.success.length)return ['결과 등록 완료',''];if(s.failed.length)return ['미이체 확인',''];return ['지급 완료','ok']}

function validateResults(){const b=store.batches.find(b=>b.id===ui.batchId);ui.resultErrors={};let chosen=[];for(const g of b.groups){if(['success','zero'].includes(g.status))continue;const d=ui.resultDraft[g.id];if(!d.status)continue;let er=[];const actual=d.actual===''?null:Number(d.actual);if(actual!==null&&(!Number.isSafeInteger(actual)||actual<0))er.push('실제 이체액은 0 이상의 정수로 입력해 주세요.');if(d.status==='success'&&actual!==g.amount)er.push('전액 성공은 실제 이체액이 예약액과 정확히 같아야 합니다.');if(d.status==='zero'&&actual!==0)er.push('0원 미이체는 실제 0원이 확인되어야 합니다.');if(!d.time)er.push('은행 처리·확인 시각을 입력해 주세요.');if(!d.ref.trim()&&d.status==='success')er.push('은행 거래 식별자를 입력해 주세요.');if(!d.evidence.trim())er.push('확인 근거를 입력해 주세요.');if(d.status==='unknown'&&!d.note.trim())er.push('미확인 사유 또는 추가 확인할 내용을 입력해 주세요.');if(!d.confirmed)er.push('결과·금액·근거 확인에 체크해 주세요.');if(er.length){ui.resultErrors[g.id]=er.join(' ');ui.expanded.add(g.id)}else chosen.push(g)}if(Object.keys(ui.resultErrors).length){render();const first=E('main').querySelector('.errormsg');first?.scrollIntoView({block:'center',behavior:'smooth'});toast('수정할 항목을 확인해 주세요. 입력한 값은 유지됩니다.');return}if(!chosen.length){toast('등록할 행의 실제 은행 결과를 선택해 주세요.');return}const summary=chosen.map(g=>({g,d:ui.resultDraft[g.id]}));dialogOpen('확인한 은행 결과를 등록할까요?',`${chosen.length}건의 결과를 기록합니다.`,`${summary.map(({g,d})=>`<div class="kv"><span>${esc(g.name)}</span><span>${pill(d.status==='success'?'전액 성공':d.status==='zero'?'0원 미이체':'일부 이체·미확인',d.status==='success'?'ok':d.status==='unknown'?'warn':'')} <strong class="num">${d.actual===''?'금액 미확인':won(d.actual)}</strong></span></div>`).join('')}<div class="helperbox">전액 성공만 연결 정산을 지급 완료로 전환합니다.<br>실제 0원은 예약을 해제하고, 일부 이체·미확인은 예약을 유지합니다.<br>선택하지 않은 결과 행은 바뀌지 않습니다.</div>`,`<div class="buttons"><button class="btn" data-act="closeDialog">계속 검토</button><button class="btn primary" data-act="saveResults" data-ids="${chosen.map(g=>g.id).join(',')}">확인한 ${chosen.length}건 등록</button></div>`,false,'resultConfirm')}

case 'saveResults':el.disabled=true;saveResults(el.dataset.ids.split(','));break;
case 'reviewExport':downloadReview(store.batches.find(b=>b.id===id));break;
case 'redownload':{const b=store.batches.find(b=>b.id===id);if(!b.groups.every(g=>g.status==='pending')){toast('은행 결과가 등록된 파일은 다시 다운로드할 수 없습니다. 내부 검토자료를 사용해 주세요.');break;}dialogOpen('같은 이체 파일을 다시 받을까요?','새 예약은 만들지 않고 기존 스냅샷을 내려받습니다.',`<p class="small">은행에서 이미 실행한 파일을 다시 제출하면 중복 지급 위험이 있습니다. 실제 은행 결과를 먼저 확인해 주세요.</p><label class="checklabel" style="margin-top:20px"><input type="checkbox" id="redownloadConsent"><span>이 파일의 실제 이체가 실행되지 않았음을 확인했습니다.</span></label>`,`<div class="buttons"><button class="btn" data-act="closeDialog">취소</button><button class="btn primary" data-act="doRedownload" data-id="${id}">기존 파일 다시 받기</button></div>`,false,'redownload');break;}
case 'doRedownload':{if(!E('redownloadConsent')?.checked){toast('은행 실행 여부를 먼저 확인해 주세요.');break;}const b=store.batches.find(b=>b.id===id);if(!b.groups.every(g=>g.status==='pending'))return;b.downloads++;audit(b.id,'기존 파일 재다운로드','새 예약 생성 없음 · 은행 미실행 확인');persist();downloadBank(b);closeDialog(true);render();break;}
case 'receipt':showReceipt(id);break;
case 'guide':showGuide();break;
case 'reset':dialogOpen('시연 데이터를 초기화할까요?','이 브라우저의 시연 변경사항만 삭제합니다.','<p class="small muted">입금 확인, 승인, 예약, 결과 등록, 업로드 대사 내역이 처음의 가상 데이터로 돌아갑니다. 실제 서비스에는 영향을 주지 않습니다.</p>','<div class="buttons"><button class="btn" data-act="closeDialog">취소</button><button class="btn primary" data-act="doReset">시연 초기화</button></div>',false,'reset');break;
case 'doReset':store=initialState();persist();ui.selected.clear();ui.resultDirty=false;ui.route='review';ui.view='list';ui.filter='all';ui.search='';ui.draftSearch='';ui.page=1;ui.pgFilter='all';ui.batchFilter='all';closeDialog(true);render();toast('시연 데이터를 초기화했습니다.');break;
}}catch(error){console.error(error);toast('시제품 처리 중 오류가 발생했습니다. 입력을 확인한 뒤 다시 시도해 주세요.')}});
document.addEventListener('submit',ev=>{if(ev.target.id==='reviewSearch'){ev.preventDefault();if(ui.search!==ui.draftSearch&&ui.selected.size){ui.selected.clear();toast('검색 범위가 바뀌어 기존 선택을 해제했습니다.')}ui.search=ui.draftSearch.trim();ui.page=1;render()}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='reviewQuery'){ui.draftSearch=t.value;E('queryHint').textContent=ui.draftSearch!==ui.search?'검색어 변경됨 · 조회 후 적용':''}if(t.dataset.result){const d=ui.resultDraft[t.dataset.gid];if(d){d[t.dataset.result]=t.type==='checkbox'?t.checked:t.value;ui.resultDirty=true;const h=E('resultDirtyHint');if(h)h.textContent='등록하지 않은 변경사항이 있습니다.'}}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='sizeSelect'){ui.pageSize=Number(t.value);ui.page=1;render()}if(t.id==='pgFile'&&t.files[0])setUpload(t.files[0]);if(t.id==='prepareConsent')E('createBatchBtn').disabled=!t.checked;if(t.dataset.result){const d=ui.resultDraft[t.dataset.gid];d[t.dataset.result]=t.type==='checkbox'?t.checked:t.value;ui.resultDirty=true;if(t.dataset.result==='status'){if(t.value==='zero')d.actual=0;ui.expanded.add(t.dataset.gid);render()}}});
document.addEventListener('dragover',ev=>{if(ev.target.closest('#dropzone')){ev.preventDefault();E('dropzone').classList.add('drag')}});document.addEventListener('dragleave',ev=>{if(ev.target.closest('#dropzone'))E('dropzone').classList.remove('drag')});document.addEventListener('drop',ev=>{if(ev.target.closest('#dropzone')){ev.preventDefault();const f=ev.dataTransfer.files[0];if(f)setUpload(f)}});
E('dialog').addEventListener('cancel',()=>{ui.dialogType=null});
window.addEventListener('beforeunload',ev=>{if(ui.resultDirty){ev.preventDefault();ev.returnValue=''}});
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(['review','pg','transfers'].includes(r)&&ui.route!==r)nav(r)});
window.addEventListener('storage',ev=>{if(ev.key===VERSION&&ev.newValue){toast('다른 창에서 시연 데이터가 변경되었습니다. 결과를 저장하기 전에 새로고침해 주세요.')}});
const hash=location.hash.slice(1);if(['review','pg','transfers'].includes(hash))ui.route=hash;render();
</script>
</body>
</html>

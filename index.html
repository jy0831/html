 (!unclosed?`<div class="filters">${filterButton('전체','all',monthRows.length)}${filterButton('자료 준비','ready',counts('ready'))}${filterButton('결과 등록','register',counts('register'))}${filterButton('대조 필요','compare',counts('compare'))}${filterButton('공개 대기','publish',counts('publish'))}${filterButton('확인 필요','needs',counts('needs'))}${filterButton('공개됨','published',counts('published'))}</div>`:'')+
 `<div class="table-top"><div><b>${shortMonth(ui.month)} 수수료</b> <span class="muted"> · ${all.length}개 입점사</span></div><div class="table-tools"><span>한 행 = 입점사 × 공급월</span><span>금액 단위: 원</span>${btn('금액 기준','money-help','','ghost small')}</div></div><div class="table-wrap"><table class="month-table"><thead><tr><th class="checkbox-cell">${selectHead(unclosed?[]:rows.map(m=>m.id))}</th><th>입점사 / 사업자번호</th><th class="num"><button class="sort-btn" data-act="sort" data-id="supply">수수료 공급가액 ${ic('sort')}</button></th><th class="num">월 발급 세액 / 청구 VAT</th><th class="num">청구 VAT와 차이</th><th>자료 준비</th><th>실제 문서</th><th>입점사 공개</th><th>다음 할 일</th></tr></thead><tbody>${rows.length?rows.map(m=>monthRow(m,unclosed)).join(''):`<tr><td colspan="9" class="empty"><h3>이 조건의 입점사가 없습니다</h3><p>다른 상태를 선택하거나 검색 조건을 초기화해 주세요.</p>${btn('조건 초기화','clear-query')}</td></tr>`}</tbody></table></div>${pager(all.length)}<p class="detail-note">자료 준비·발급 결과·대조·공개는 각각 별도로 기록합니다. 월 전체 누락 여부는 문서 한 건의 대조만으로 확정하지 않습니다.</p>`}
function monthRow(m,unclosed){let t=total(m),ds=docsFor(m),n=next(m),pub=ds.filter(d=>d.visibility==='public').length;return `<tr class="${ui.selected.has(m.id)?'selected-row':''}"><td class="checkbox-cell"><input type="checkbox" data-select="${m.id}" aria-label="${esc(m.name)} ${monthText(ui.month)} 선택" ${ui.selected.has(m.id)?'checked':''} ${unclosed?'disabled':''}></td><td>${unclosed?`<strong class="rowname">${esc(m.name)}</strong>`:`<a class="rowname" href="#month/${m.id}" data-act="month" data-id="${m.id}">${esc(m.name)}</a>`}<span class="sub mono">${esc(m.recipient.biz)}</span></td><td class="num"><span class="money">${unclosed?'미집계':num(t.supply)}</span>${!unclosed&&m.missing.length?'<span class="sub negative">미확인 원천 별도</span>':''}</td><td class="num"><span class="money">${unclosed?'미집계':num(t.tax)}</span>${!unclosed?`<span class="sub">청구 VAT ${num(t.charged)}</span>`:''}</td><td class="num"><span class="money ${!unclosed&&t.tax-t.charged?'blue-text':''}">${unclosed?'미집계':signed(t.tax-t.charged)}</span>${!unclosed&&m.rounding?'<span class="sub">단수 기록 있음</span>':''}</td><td>${unclosed?badge('월마감 전'):m.snapshot?badge('사본 저장','ok'):prepReasons(m).length?badge('확인 필요','warn'):badge('준비 전')}</td><td>${unclosed?badge('집계 전'):latestUnknown(m)?`${badge('결과불명','warn')}<span class="sub">재발급 전 원결과 조회</span>`:ds.length?`${badge(ds.some(d=>!d.matched)?'대조 필요':'대조 완료',ds.some(d=>!d.matched)?'warn':'ok')}<span class="sub">${ds.length}개 문서${ds.some(d=>d.kind==='correction')?' · 수정 포함':''}</span>`:badge('미등록')}</td><td>${unclosed?'—':pub?badge(pub===ds.length?'공개됨':'일부 공개','ok'):badge('미공개')}</td><td>${unclosed?'<span class="hint">월마감 후 집계</span>':`<button class="next-button" data-act="month-next" data-id="${m.id}">${n.action}${ic('arrow')}</button>${n.key==='needs'?`<span class="sub">${esc(n.desc)}</span>`:''}`}</td></tr>`}
function selectionBar(){const ids=[...ui.selected];if(ui.page!=='months'||!ids.length||ui.month==='2026-10')return '';const ms=ids.map(getM),can=ms.filter(m=>!m.snapshot&&!prepReasons(m).length);return `<div class="stickybar"><div class="selection-text"><strong><b>${ids.length}개 입점사</b> 선택</strong><span class="hint">전체 월 단위로 준비 · ${can.length}개 준비 가능</span>${link('선택 해제','clear-selection')}</div><div class="head-actions">${btn(`${ic('down')} 선택 요약 Excel`,'export-selected')}${btn(`${can.length}개 발급 자료 준비`,'bulk-prepare','','primary',!can.length?'disabled':'')}</div></div>`}
function back(target='months',label='월별 목록으로'){return `<button class="back" data-act="back" data-id="${target}">${ic('left')}${label}</button>`}
function summaryTable(m){const t=total(m),ds=docsFor(m),matched=ds.filter(d=>d.matched),pub=ds.filter(d=>d.matched&&d.visibility==='public');const row=(title,ss,unready,hint,cls='')=>`<tr class="${cls}"><td>${title}<span class="sub">${hint}</span></td><td class="num">${ss?num(ss.supply):unready}</td><td class="num">${ss?num(ss.tax):unready}</td><td class="num">${ss?num(ss.supply+ss.tax):unready}</td></tr>`;return `<div class="table-wrap"><table class="compare-table"><thead><tr><th>비교 범위</th><th class="num">공급가액</th><th class="num">세액</th><th class="num">합계</th></tr></thead><tbody>${row('원공급월 기대액',t,'',m.missing.length?`확인된 원천만 합산 · ${m.missing.length}건 미확인`:`${m.rows.length}개 원거래 · 정상 월 전체`)}${row('실제 대조 문서 순액',matched.length?{supply:sum(matched,'supply'),tax:sum(matched,'tax')}:null,ds.length?'대조 전':'미등록',`대조 완료 ${matched.length} / 등록 ${ds.length}개 문서 · 증감 반영`)}${row('입점사 공개 문서 순액',pub.length?{supply:sum(pub,'supply'),tax:sum(pub,'tax')}:null,'미공개',`공개 ${pub.length}개 문서만 포함`,'total')}</tbody></table></div>`}
function renderParty(p,title){return `<div class="party"><h3>${title}</h3><strong>${esc(p.name||'상호 미확인')}</strong><p class="mono">${esc(p.biz||'사업자번호 미확인')}</p><p>대표자 ${esc(p.ceo||'미확인')}</p><p class="${!p.address?'missing':''}">${esc(p.address||'주소 확인 필요')}</p><p>${esc(p.business||'업태 미확인')} · ${esc(p.category||'종목 미확인')}</p></div>`}
function partySection(m){return `<section class="section" id="parties"><div class="section-head"><h2>공급자·수취인</h2>${btn('수취인 정보 확인','party',m.id,'small')}</div><div class="party-grid">${renderParty(store.supplier,'공급자 · SCENE')}${renderParty(m.recipient,'수취인 · 입점사')}</div><p class="detail-note">현재 등록 정보입니다. 저장한 준비 사본과 실제 문서의 기재정보는 이후 프로필 변경으로 바뀌지 않습니다.</p></section>`}
function docLinks(m){const ds=docsFor(m);return `<section class="section" id="documents"><div class="section-head"><h2>연결된 실제 문서 <span class="scope-label">${ds.length}개</span></h2>${btn('홈택스 결과 등록','register',m.id,'small')}</div>${ds.length?ds.map(d=>`<div class="doc-line">${ic('file')}<div class="doc-main"><strong>${d.kind==='normal'?'정상':'수정'} 문서</strong> ${tag(d.visibility==='public'?'공개됨':'미공개',d.visibility==='public'?'ok':'')}<span class="mono">${esc(d.approval)}</span><span class="sub">작성일 ${dotDate(d.writeDate)}${d.originalDoc?' · 원본 '+d.originalDoc+' 연결':''}</span></div><div class="num"><strong>${won(d.supply+d.tax)}</strong><span class="sub">${d.matched?'대조 완료':'대조 필요'}</span></div>${btn(d.matched?'문서 보기':'문서 대조','document',d.id,'small')}</div>`).join(''):`<div class="screen-message">SCENE에 등록된 실제 문서가 없습니다.<p class="hint">홈택스 미발급을 의미하지 않습니다. 발급했다면 실제 결과를 등록해 주세요.</p></div>`}</section>`}
function sourceSection(m){const missing=m.missing.length,filtered=ui.sourceFilter==='missing'?[]:m.rows;const page=filtered.slice((ui.sourcePage-1)*6,ui.sourcePage*6);const pages=Math.ceil(filtered.length/6)||1;return `<section class="section" id="sources"><div class="section-head"><h2>원거래·공급 근거 <span class="scope-label">${m.rows.length}건 확인${missing?' · '+missing+'건 미확인':''}</span></h2>${btn(`${ic('down')} 원거래 Excel`,'export-sources',m.id,'small')}</div><div class="mode-line"><div class="pill-group"><button class="filter ${ui.sourceFilter==='all'?'active':''}" data-act="source-filter" data-id="all">확인된 원거래 ${m.rows.length}</button>${missing?`<button class="filter ${ui.sourceFilter==='missing'?'active':''}" data-act="source-filter" data-id="missing">미확인 원천 ${missing}</button>`:''}</div><span>당시 저장값 · 현재 요율 재계산 안 함</span></div><div class="table-wrap"><table class="source-table tight"><thead><tr><th>상품 주문 / 브랜드</th><th>공급일 / 기준</th><th>수수료 품목</th><th class="num">공급가액</th><th class="num">청구 VAT</th><th>확인 근거</th></tr></thead><tbody>${ui.sourceFilter==='missing'?m.missing.map(r=>`<tr><td><span class="mono">${esc(r.order)}</span></td><td>미확인</td><td>${esc(r.reason)}</td><td class="num">미확인</td><td class="num">미확인</td><td>${badge('근거 필요','warn')}</td></tr>`).join(''):page.map(r=>`<tr><td><span class="mono">${esc(r.order)}</span><span class="sub">${esc(r.brand)} · ${esc(r.product)}</span></td><td>${dotDate(r.date)}<span class="sub">${r.kind===feeNames[2]?'확정된 주문 종결 기준':'상품 구매확정일'}</span></td><td>${esc(r.kind)}</td><td class="num">${num(r.supply)}</td><td class="num">${num(r.vat)}</td><td>${badge(r.supply<0?'반환 여부 미확인':'공제 근거 있음',r.supply<0?'warn':'ok')}<span class="sub mono">${esc(r.proof)}</span></td></tr>`).join('')}</tbody></table></div>${ui.sourceFilter==='all'?`<div class="table-footer"><span>${(ui.sourcePage-1)*6+1}–${Math.min(ui.sourcePage*6,m.rows.length)} / ${m.rows.length}건</span><div class="pages"><button data-act="source-page" data-id="${ui.sourcePage-1}" ${ui.sourcePage===1?'disabled':''}>‹</button><span>${ui.sourcePage} / ${pages}</span><button data-act="source-page" data-id="${ui.sourcePage+1}" ${ui.sourcePage===pages?'disabled':''}>›</button></div></div>`:''}<details class="disclosure"><summary>실제 청구·회수·반환 <span class="sub">문서 순액과 별도 근거</span></summary><div><dl class="definition"><div><dt>최초 원거래 청구</dt><dd>${won(sum(m.rows.filter(r=>r.supply>=0),r=>r.supply+r.vat))}</dd></div><div><dt>확인 공제액</dt><dd>${won(sum(m.rows,'collected'))}</dd></div><div><dt>확인 반환액</dt><dd>${m.id==='M07'?'반환 여부 미확인':won(sum(m.rows,'returned'))}</dd></div><div><dt>근거 상태</dt><dd>${m.missing.length?`${m.missing.length}건 확인 필요`:'시연 금융 근거 연결'}</dd></div></dl><p class="hint">수정 문서 금액이 음수여도 실제 반환·추가 청구는 자동 처리하지 않습니다.</p></div></details></section>`}
function historyBlock(subjects){const logs=store.audit.filter(a=>subjects.includes(a.subject));return `<details class="disclosure"><summary>처리·정정·공개 이력 <span class="sub">${logs.length}개 기록</span></summary><div>${logs.length?`<ol class="audit">${logs.map(a=>`<li><b>${esc(a.event)}</b><small>${esc(a.detail)}</small><time>${esc(a.time)} · ${esc(a.actor)}</time></li>`).join('')}</ol>`:'<p class="hint">아직 기록된 작업이 없습니다.</p>'}</div></details>`}
function monthPage(){const m=getM(ui.detail);if(!m)return missingPage();const t=total(m),n=next(m),reason=prepReasons(m),ds=docsFor(m);return back()+header(`${m.name} · ${monthText(m.month)}`,'한 입점사의 월 수수료와 실제 문서를 같은 범위에서 확인합니다.',btn(`${ic('down')} 월 요약 Excel`,'export-one',m.id),`<span class="mono">${esc(m.seller)}</span>${tag('수수료')}${badge(n.label,n.style)}`)+

function casePage(){const c=store.cases.find(c=>c.id===ui.detail);if(!c)return missingPage();const m=getM(c.monthId),remaining=caseRemaining(c);return back('cases','수정·누락 목록으로')+header(c.title,`${m.name} · ${monthText(m.month)} · ${c.type}`,btn('월별 원천 보기','month',m.id),`<span class="mono">${c.id}</span>${badge(...caseStatus(c))}`)+`<div class="work-layout"><div class="work-main"><section class="section"><div class="section-head"><h2>현재 확인할 문제</h2>${tag('남은 항목 '+remaining+'건',remaining?'warn':'ok')}</div>${notice(esc(c.note),'warn')}<dl class="definition"><div><dt>원공급월</dt><dd>${monthText(m.month)}</dd></div><div><dt>입점사</dt><dd>${esc(m.name)}</dd></div><div><dt>연결 문서</dt><dd>${c.docId?link(c.docId,'document',c.docId):'문서 연결 전'}</dd></div><div><dt>원천 범위</dt><dd>${c.sourceIds.length?c.sourceIds.map(s=>esc(s)).join('<br>'):'문서·당사자 단위 검토'}</dd></div></dl></section><section class="section"><div class="section-head"><h2>처리 방향·담당</h2></div><div class="formgrid"><div class="field"><label for="case-owner">담당자</label><select id="case-owner">${staff.map(s=>`<option ${c.owner===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="case-status">진행 상태</label><select id="case-status">${[['open','확인 필요'],['progress','검토 중'],['waiting','외부 확인 대기'],...(c.status==='closed'?[['closed','완료']]:[])].map(([k,t])=>`<option value="${k}" ${c.status===k?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="case-due">내부 판단 마감 (선택)</label><input type="date" id="case-due" value="${esc(c.due)}"><span class="hint">법정 발급기한이 아닌 내부 업무 일정</span></div><div class="field"><label for="case-external">확인된 외부 기한 (선택)</label><input type="date" id="case-external" value="${esc(c.externalDeadline||'')}"><span class="hint">확인 근거가 있을 때만 기록</span></div><div class="field full"><label for="case-basis">기한·처리 판단 근거</label><input id="case-basis" value="${esc(c.deadlineBasis)}"></div><div class="field full"><label for="case-direction">처리 방향</label><textarea function inquiryList(){const qs=store.inquiries.filter(q=>ui.filter==='all'||q.status===ui.filter).filter(q=>!ui.query||`${q.title} ${getM(q.monthId).name}`.includes(ui.query));return header('입점사 문의','공개 문서의 질문을 원거래·발급 결과와 연결해 확인하고 답변합니다.')+`<form id="query-form" class="querybar"><label class="search">입점사·문의 내용<input id="query-text" value="${esc(ui.draftQuery)}" placeholder="입점사명 또는 문의 내용"></label><button class="btn" type="submit">조회</button><span id="pending-query" class="pending-query" hidden>변경한 검색어는 조회 후 적용됩니다</span></form><div class="filters">${filterButton('전체','all',store.inquiries.length)}${filterButton('답변 대기','open',store.inquiries.filter(q=>q.status==='open').length)}${filterButton('답변 완료','answered',store.inquiries.filter(q=>q.status==='answered').length)}</div><div class="table-wrap"><table style="min-width:760px"><thead><tr><th>문의 제목</th><th>입점사 / 원공급월</th><th>연결 문서</th><th>접수일</th><th>상태</th><th>작업</th></tr></thead><tbody>${qs.length?qs.map(q=>`<tr><td><a href="#inquiry/${q.id}" class="rowname" data-act="inquiry" data-id="${q.id}">${esc(q.title)}</a><span class="sub">메시지 ${q.messages.length}개</span></td><td>${esc(getM(q.monthId).name)}<span class="sub">${monthText(getM(q.monthId).month)}</span></td><td class="mono">${q.docId||'월별 자료'}</td><td>${esc(q.created.slice(0,10))}</td><td>${badge(q.status==='open'?'답변 대기':'답변 완료',q.status==='open'?'warn':'ok')}</td><td>${btn(q.status==='open'?'답변하기':'답변 보기','inquiry',q.id,'small')}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">해당 조건의 문의가 없습니다.</td></tr>'}</tbody></table></div>`}
function inquiryPage(seller=false){const q=store.inquiries.find(q=>q.id===ui.detail);if(!q||seller&&q.seller!==ui.seller)return missingPage();const m=getM(q.monthId);return back(seller?'seller':'inquiries',seller?'입점사 조회로':'문의 목록으로')+header(q.title,`${m.name} · ${monthText(m.month)} · ${q.docId||'월별 자료'}`,'',badge(q.status==='open'?'답변 대기':'답변 완료',q.status==='open'?'warn':'ok'))+`<div class="work-layout"><div class="work-main"><div class="thread">${q.messages.map((msg,i)=>`<div class="message ${msg.actor==='운영자'?'staff':''}"><div class="message-head"><b>${esc(msg.actor)}</b><time>${esc(msg.time)}</time></div>${esc(msg.text)}${msg.attachment?`<button class="filetag linkbtn" data-act="inquiry-file" data-id="${q.id}" data-index="${i}">${ic('file')}${esc(msg.attachment.name)}</button>`:''}</div>`).join('')}</div><section class="section" style="margin-top:28px"><div class="section-head"><h2>${seller?'추가 문의':'답변 작성'}</h2></div><div class="field"><label class="sr-only" for="reply-text">${seller?'문의 내용':'답변 내용'}</label><textarea id="reply-text" style="min-height:140px" placeholder="${seller?'확인할 내용을 적어 주세요.':'확인된 사실과 입점사가 할 수 있는 다음 행동을 안내해 주세요.'}"></textarea></div><div class="field" style="margin-top:13px"><label for="reply-attachment">첨부파일 (선택)</label><input id="reply-attachment" type="file" accept=".pdf,.png,.jpg,.jpeg" data-file="reply"><span class="hint" id="reply-file-name">시제품 제한: PDF·PNG·JPG, 5MB 이하 · 브라우저 메모리에서만 사용</span></div><div class="form-actions"><p class="hint">시연 메시지만 저장됩니다. 실제 알림은 발송하지 않습니다.</p>${btn(seller?'추가 문의 보내기':'입점사에 답변 등록','save-reply',q.id,'primary',seller?'data-seller="true"':'')}</div></section></div><aside class="work-rail"><div class="rail-box"><div class="rail-title">관련 자료</div>${q.docId&&(!seller||sellerVisible(getD(q.docId)))?btn('연결 문서 보기',seller?'seller-doc':'document',q.docId,'wide'):''}${!seller?btn('월별 금액·원거래 보기','month',m.id,'wide'):''}${!seller?btn('검토 작업 만들기','new-case',m.id,'wide ghost',q.docId?`data-doc="${q.docId}"`:''):''}<p class="detail-note">문의 답변만으로 발급 기록이나 문서 공개 상태는 변경되지 않습니다.</p></div></aside></div>`}
function sellerVisible(d){if(!d)return false;const m=getM(d.monthId);return m.seller===ui.seller&&d.visibility==='public'&&d.matched&&d.recipient.biz===m.recipient.biz&&!!d.original}
function sellerSelectBanner(){return `<div class="seller-banner">${ic('lock')}<strong>입점사 조회 미리보기</strong><select id="preview-seller" aria-label="가상 입점사 계정 선택">${store.months.map(m=>`<option value="${m.seller}" ${ui.seller===m.seller?'selected':''}>${esc(m.name)} (가상 계정)</option>`).join('')}</select><span class="hint">시연용 전환 · 실제 인증·권한 검증은 연결되지 않음</span>${btn('운영자 화면으로','nav','','small','data-page="months"')}</div>`}

function monthReviewDialog(m){const ds=docsFor(m).filter(d=>d.matched),t=total(m),blocks=[];if(m.missing.length)blocks.push('미확인 원천이 남아 있음');if(latestUnknown(m))blocks.push('외부 결과불명 남아 있음');if(!ds.length||sum(ds,'supply')!==t.supply||sum(ds,'tax')!==t.tax)blocks.push('대조 문서 순액과 원공급월 기대액 확인 필요');if(docsFor(m).some(d=>!d.matched))blocks.push('대조 전 문서가 남아 있음');modal('월 전체 누락·중복 확인',summaryTable(m)+`<p class="hint" style="margin-top:15px">문서 한 건의 대조가 아닌 월 전체 원천의 누락·중복을 확인한 기록입니다.</p>${blocks.length?`<ul class="block-reasons">${blocks.map(s=>`<li>${s}</li>`).join('')}</ul>`:''}<div class="field" style="margin-top:16px"><label for="month-proof">월 전체 확인 근거</label><input id="month-proof" value="${esc(m.monthProof||'')}" placeholder="원천·문서 범위 및 누락·중복 검토 기록"></div><label class="checkline"><input id="month-check" type="checkbox"><span>해당 공급월 전체 원천과 실제 문서의 누락·중복을 확인했습니다.</span></label>`,btn('닫기','close')+btn('월 확인 기록 저장','modal-confirm','','primary',blocks.length?'disabled':''),()=>{if(!E('month-check').checked||!E('month-proof').value.trim())return toast('확인 항목과 근거를 남겨 주세요.');m.monthReview='complete';m.monthProof=E('month-proof').value.trim();audit(m.id,'월 전체 확인 기록',m.monthProof);closeModal();render();toast('월 전체 확인 기록을 저장했습니다. 전송·신고는 실행하지 않았습니다.');});}

function visibilityDialog(d,mode){const recall=mode==='recalled',release=mode==='private';const title=recall?'입점사 공개 회수':release?'공개 보류 해제 검토':'입점사 공개 보류';modal(title,notice(recall?'SCENE에서의 제공을 중단합니다. <strong>이미 내려받은 파일을 삭제하거나 홈택스 발급 사실을 취소하지 않습니다.</strong>':release?'기존 보류 사유를 검토하고 미공개 상태로 돌립니다. 공개는 조건을 확인한 뒤 별도로 진행합니다.':'문서의 공개를 보류합니다. 실제 홈택스 문서는 변경하지 않습니다.','warn')+`<p><strong>${esc(getM(d.monthId).name)}</strong> · <span class="mono">${esc(d.approval)}</span></p>${d.holdReason?`<p class="hint" style="margin-top:10px">기존 보류 사유: ${esc(d.holdReason)}</p>`:''}<div class="field" style="margin-top:18px"><label for="visibility-reason">처리 사유</label><textarea id="visibility-reason" placeholder="사유와 확인 근거를 적어 주세요."></textarea></div>`,btn('돌아가기','close')+btn(recall?'사유 남기고 공개 회수':release?'미공개 상태로 전환':'사유 남기고 보류','modal-confirm','',recall?'danger':'primary',release&&!d.matched?'disabled':''),()=>{const r=E('visibility-reason').value.trim();if(!r)return toast('처리 사유를 남겨 주세요.');if(release&&!d.matched)return toast('중요 정보 정정 후에는 재대조부터 완료해 주세요.');d.visibility=mode;d.holdReason=r;audit(d.id,title,r);closeModal();render();toast(title+' 기록을 저장했습니다. 홈택스 문서는 변경되지 않았습니다.');});}
function accountingDialog(d){modal('세무·회계 외부 확인 기록',notice('담당자가 확인한 <strong>외부 근거</strong>를 기록합니다. 저장만으로 전송·신고·분개는 실행되지 않습니다.','blue')+`<div class="formgrid"><div class="field"><label for="acc-trans">국세청 전송 확인</label><select id="acc-trans">${[['unconfirmed','미확인'],['confirmed','외부 전송 성공 확인'],['error','외부 전송 오류 확인']].map(([k,t])=>`<option value="${k}" ${d.transmission.status===k?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="acc-time">전송 확인 시각</label><input id="acc-time" type="datetime-local" value="${esc(d.transmission.at||'')}"></div><div class="field"><label for="acc-handoff">세무대리인 전달</label><select id="acc-handoff"><option value="unconfirmed">미확인</option><option value="confirmed" ${d.accounting.handoff==='confirmed'?'selected':''}>전달 근거 확인</option></select></div><div class="field"><label for="acc-filing">신고 반영</label><select id="acc-filing"><option value="unconfirmed">미확인</option><option value="confirmed" ${d.accounting.filing==='confirmed'?'selected':''}>반영 근거 확인</option></select></div><div class="field"><label for="acc-receipt">청구·영수 표시 확인</label><select id="acc-receipt">${[['unconfirmed','미확인'],['claim','청구'],['receipt','영수']].map(([k,t])=>`<option value="${k}" ${d.accounting.receipt===k?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="acc-reason">청구·영수 판단 근거</label><input id="acc-reason" value="${esc(d.accounting.reason||'')}"></div><div class="field full"><label for="acc-evidence">전송·전달·신고 확인 근거</label><textarea id="acc-evidence" placeholder="각 확인 항목의 외부 기록과 해당 자료를 구분해 적어 주세요.">${esc(d.accounting.evidence||d.transmission.evidence||'')}</textarea></div></div><p class="detail-note">시연 기록이며 실제 국세청 조회·신고·자동 분개 또는 비용 인정 검증은 하지 않습니다.</p>`,btn('취소','close')+btn('확인 기록 저장','modal-confirm','','primary'),()=>{const tr=E('acc-trans').value,at=E('acc-time').value,ev=E('acc-evidence').value.trim(),receipt=E('acc-receipt').value,reason=E('acc-reason').value.trim(),handoff=E('acc-handoff').value,filing=E('acc-filing').value;if((tr!=='unconfirmed'||handoff==='confirmed'||filing==='confirmed')&&!ev)return toast('확인된 외부 근거를 남겨 주세요.');if(tr!=='unconfirmed'&&!at)return toast('전송 결과를 확인한 시각을 기록해 주세요.');if(receipt!=='unconfirmed'&&!reason)return toast('청구·영수 표시의 판단 근거가 필요합니다.');d.transmission={status:tr,at,evidence:ev};d.accounting={handoff,filing,receipt,reason,evidence:ev};audit(d.id,'세무·회계 확인 기록','외부 근거 기록 · 자동 실행 없음');closeModal();render();toast('외부 확인 기록을 저장했습니다. 전송·신고·분개는 실행하지 않았습니다.');});}
function newCaseDialog(monthId,docId=null,type=''){const selected=getM(monthId)||getM('M01');const types=['누락·근거 미확인','수수료 증감','홈택스 문서 기재 오류','중복 발급','당사자 자격·정보','외부 결과불명','내부 입력 오류','내부 연결 오류'];modal('수정·누락 검토 작업 만들기',notice('검토 작업과 실제 수정 발급은 별개입니다. 유형별 적용 기준·문서 역할 조건을 확인한 뒤 처리합니다.','blue')+`<div class="formgrid"><div class="field"><label for="newcase-month">대상 입점사·공급월</label><select id="newcase-month">${store.months.map(m=>`<option value="${m.id}" ${m.id===selected.id?'selected':''}>${esc(m.name)} · ${monthText(m.month)}</option>`).join('')}</select></div><div class="field"><label for="newcase-type">문제 유형</label><select id="newcase-type">${types.map(t=>`<option ${t===type?'selected':''}>${t}</option>`).join('')}</select></div><div class="field full"><label for="newcase-title">확인할 작업</label><input id="newcase-title" placeholder="예: 실제 문서의 수취인 상호 확인"></div><div class="field full"><label for="newcase-note">확인한 사실과 남은 항목</label><textarea id="newcase-note"></textarea></div></div><p class="detail-note">${docId?'연결 문서 '+esc(docId):'특정 문서 없이 월별 자료에 연결합니다.'} · 실제 금액·문서 상태는 바뀌지 않습니다.</p>`,btn('취소','close')+btn('검토 작업 만들기','modal-confirm','','primary'),()=>{const mid=E('newcase-month').value,title=E('newcase-title').value.trim(),note=E('newcase-note').value.trim();if(!title||!note)return toast('작업 제목과 확인 내용을 입력해 주세요.');if(docId&&getD(docId).monthId!==mid)return toast('연결 문서의 입점사·공급월과 대상이 다릅니다.');const c={id:`C${++store.seq}`,monthId:mid,docId,type:E('newcase-type').value,title,note,owner:'김운영',due:'',deadlineBasis:'확인된 외부 기한 없음',status:'open',remaining:1,sourceIds:[],direction:'확인할 원천·문서와 처리 범위 검토',evidence:''};store.cases.unshift(c);audit(c.id,'검토 작업 생성',title);closeModal();go('case',c.id);toast('원천·문서에 검토 작업을 연결했습니다. 실제 수정 발급은 실행하지 않았습니다.');});}
function newInquiryDialog(mid,docId=null){const m=getM(mid);if(m.seller!==ui.seller)return toast('현재 가상 계정에 속한 자료만 문의할 수 있습니다.');if(docId&&!sellerVisible(getD(docId)))return toast('공개된 자기 명의 문서만 연결할 수 있습니다.');ui.newInquiryFile=null;modal('세금계산서 문의 작성',`<p class="hint">${esc(m.name)} · ${monthText(m.month)} ${docId?'· '+esc(docId):''}</p><div class="formgrid" style="margin-top:17px"><div class="field full"><label for="newq-title">제목</label><input id="newq-title" placeholder="확인할 내용을 짧게 적어 주세요."></div><div class="field full"><label for="newq-text">문의 내용</label><textarea id="newq-text" placeholder="금액·기재정보 등 확인이 필요한 내용을 알려주세요."></textarea></div><div class="field full"><label for="newq-file">첨부파일 (선택)</label><input id="newq-file" type="file" accept=".pdf,.png,.jpg,.jpeg" data-file="new-inquiry"><span class="hint">시제품 제한: PDF·PNG·JPG, 5MB 이하 · 브라우저 메모리에만 저장</span></div></div>`,btn('취소','close')+btn('문의 보내기','modal-confirm','','primary'),()=>{const title=E('newq-title').value.trim(),text=E('newq-text').value.trim();if(!title||!text)return toast('제목과 문의 내용을 입력해 주세요.');const q={id:`Q${++store.seq}`,monthId:m.id,seller:m.seller,docId,title,status:'open',created:now(),messages:[{actor:'입점사',text,time:now(),attachment:ui.newInquiryFile||null}]};store.inquiries.unshift(q);audit(q.id,'문의 등록','현재 가상 입점사 계정');closeModal();go('seller-inquiry',q.id);toast('시연 문의를 등록했습니다. 운영자 문의함에서도 확인할 수 있습니다.');});}
function showHelp(){modal('업무 흐름·시제품 안내',`<p><strong>발급할 자료와 실제 발급 문서를 분리합니다.</strong></p><div class="help-list"><div><div><strong>월별 발급 준비</strong>seller별 공급월을 기준으로 원천·당사자·금액을 확인하고 당시 사본을 저장합니다.</div></div><div><div><strong>홈택스에서 직접 발급 · 외부 작업</strong>SCENE은 발급을 실행하지 않습니다. 실제 문서는 담당자가 홈택스에서 발급합니다.</div></div><div><div><strong>발급 결과·공개</strong>확인한 외부 결과를 등록하고 준비 사본과 대조합니다. 공개는 별도 확인 후 진행합니다.</div></div><div><div><strong>수정·누락 관리 / 입점사 문의</strong>원천·문서 연결과 잔여 작업을 유지하고, 공개 문서의 질문에 답변합니다.</div></div></div><h3 style="margin:20px 0 10px">이 HTML의 범위</h3><p class="hint">가상 데이터로 동작하는 UI 시제품입니다. 실제 PG·홈택스·국세청·운영 DB·권한 서버와 연결되지 않습니다. 모든 저장·공개·문의는 현재 브라우저 메모리의 시연 상태만 바꾸며 새로고침하면 초기화됩니다. 업로드한 파일은 외부로 전송하지 않습니다.</p><p class="hint" style="margin-top:9px">PDF는 파일 선택·보관·다운로드를 시연하며 내용 자동 판독을 하지 않습니다. ‘시연 결과 채우기’의 PDF는 실제 문서가 아닌 안내용 샘플입니다. Excel은 가상 내부 검토자료이며 홈택스 일괄발급 제출 양식이 아닙니다.</p><h3 style="margin:20px 0 10px">설계 기준</h3><p class="hint">기능: 사용자 제공 「SCENE 세금계산서 관리와 조회 기능 안내」 v1.0, 2026-10-18.<br>편의성: 「KRDS 기반 PC 어드민 UI/UX 최종가이드」 v1.1, 특히 4장 정보 구조, 8~11장 목록·입력·상태, 13장 접근성, 15장 상호작용 명세.<br>미정인 수정 유형 조건·원본 검증·완전한 서버 권한·법정기한은 이 시제품이 대신 판단하지 않습니다.</p>`);}

 case'month-next':{const m=getM(id),n=next(m);if(n.key==='register')startRegister(m.id);else if(n.key==='compare')go('document',docsFor(m).find(d=>!d.matched).id);else if(n.key==='publish')go('document',docsFor(m).find(d=>d.matched&&d.visibility==='private').id);else go('month',id);break;}
 case'back':{let target=id||'months';if(target==='month'){const mid=getM(ui.detail)?.id||getD(ui.detail)?.monthId;go('month',mid);}else go(target,null,{restore:true});break;}
 case'filter':ui.filter=id;ui.pageNo=1;ui.selected.clear();render();break;

 case'sort':ui.dir=ui.sort===id?-ui.dir:1;ui.sort=id;render();break;

 case'clear-original':ui.form.original=null;ui.dirty=true;render();break;
 case'save-result':saveResult();break;
 case'document':go('document',id);break;
 case'match':{const d=getD(id);if(!canMatch(d))return toast('사본·원본·불일치 항목을 먼저 확인해 주세요.');if(!E('match-original')?.checked||!E('match-scope')?.checked)return toast('원본과 문서별 대조 범위를 확인해 주세요.');d.matched=true;d.matchedAt=now();if(!d.snapshot)d.snapshot=copy(getM(d.monthId).snapshot);d.versions.forEach(v=>v.pending=false);audit(d.id,'문서별 대조 완료',`준비 사본 ${d.snapshot.id} · 입점사 공개 전`);render();toast('이 문서의 대조를 완료했습니다. 월 전체 누락 확인·입점사 공개는 별도입니다.');break;}
 case'publish':publishDialog(getD(id));break;
 case'hold':visibilityDialog(getD(id),'hold');break;
 case'recall':visibilityDialog(getD(id),'recalled');break;
 case'release-hold':visibilityDialog(getD(id),'private');break;
 case'rounding':roundingDialog(getM(id));break;
 case'party':partyDialog(getM(id));break;
 case'month-review':monthReviewDialog(getM(id));break;
 case'accounting':accountingDialog(getD(id));break;
 case'new-case':newCaseDialog(id,el.dataset.doc||null,el.dataset.type||'');break;
 case'month-cases':showMonthSubset('cases',id);break;
 case'month-inquiries':showMonthSubset('inquiries',id);break;
 case'case':go('case',id);break;
 case'save-case':saveCase(store.cases.find(c=>c.id===id));break;
 case'complete-case':completeCase(store.cases.find(c=>c.id===id));break;
 case'inquiry':ui.replyFile=null;go('inquiry',id);break;
 case'save-reply':saveReply(id,el.dataset.seller==='true');break;
 case'inquiry-file':{const q=store.inquiries.find(q=>q.id===id);if(ui.page==='seller-inquiry'&&q.seller!==ui.seller)return;downloadDataFile(q.messages[Number(el.dataset.index)].attachment);break;}
 case'seller-preview':if(ui.dirty&&!window.confirm('입력 중인 내용을 버리고 입점사 미리보기로 이동할까요?'))return;ui.dirty=false;ui.seller=id||ui.seller;go('seller');break;
 case'seller-doc':go('seller-doc',id);break;
 case'seller-inquiry':ui.replyFile=null;go('seller-inquiry',id);break;
 case'new-inquiry':newInquiryDialog(id,el.dataset.doc||null);break;
 case'download-pdf':{const d=getD(id);if(ui.page.startsWith('seller')&&!sellerVisible(d))return toast('자기 명의의 공개 원본만 내려받을 수 있습니다.');downloadDataFile(d.original);audit(d.id,'원본 다운로드',ui.page.startsWith('seller')?'입점사 미리보기':'운영자 시연');break;}
 case'export-month':exportMonthly(monthlyRows());break;
 case'export-selected':exportMonthly([...ui.selected].map(getM));break;
 case'export-one':exportMonthly([getM(id)]);break;
 case'export-snapshot':exportSnapshot(getM(id));break;
 case'export-docs':exportDocs(ui.filter==='unknown'?[]:documentRows());break;
 case'export-seller':exportDocs(sellerDocs(),true);break;
 case'export-sources':exportSources(getM(id));break;
 case'export-seller-sources':{const d=getD(id);if(sellerVisible(d))exportSources(getM(d.monthId),d);break;}
 case'source-filter':ui.sourceFilter=id;ui.sourcePage=1;render();E('sources')?.scrollIntoView({block:'start'});break;
 case'source-page':ui.sourcePage=Number(id);render();E('sources')?.scrollIntoView({block:'start'});break;
 case'error-focus':{const target=E(id)||E(id==='f-confirm'?'record-confirm':'main');target?.focus();target?.scrollIntoView({block:'center'});break;}
 case'help':showHelp();break;
 case'money-help':moneyHelp();break;
 case'external':externalHelp();break;
 case'qualification':modal('발급자 자격 설정 · 별도 화면',notice('운영 안내에서 발급자 자격 설정은 기존 별도 화면에 연결하도록 구분하고 있습니다.','blue')+'<p class="hint">이 HTML에는 해당 설정 화면·실제 당사자 자료가 연결되어 있지 않습니다. 현재 공급자 확인 상태는 가상의 시연값이며 실제 발급 자격 판정이 아닙니다.</p>');break;
 case'close':closeModal();break;
 case'modal-confirm':if(modalAction)modalAction();break;
 case'reset':modal('시연 데이터 초기화','<p>이 HTML에서 변경한 시연 기록과 선택한 파일을 초기화합니다.</p><p class="hint" style="margin-top:9px">실제 서비스에는 영향을 주지 않습니다.</p>',btn('취소','close')+btn('시연 데이터 초기화','modal-confirm','','primary'),()=>{store=initial();Object.keys(listMemo).forEach(k=>delete listMemo[k]);ui.dirty=false;ui.month=MONTH;ui.draftMonth=MONTH;ui.seller='SELLER-009';ui.form=null;ui.query='';ui.draftQuery='';ui.selected.clear();ui.filter='all';closeModal();go('months');toast('가상 데이터를 초기화했습니다.');});break;
 }}catch(err){console.error(err);toast('시제품 동작 중 오류가 발생했습니다. 시연 데이터를 초기화해 다시 확인해 주세요.');}
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.field&&ui.form&&el.dataset.field!=='monthId'&&el.dataset.field!=='kind'){const parts=el.dataset.field.split('.');let obj=ui.form;for(const k of parts.slice(0,-1))obj=obj[k];obj[parts.at(-1)]=el.value;ui.dirty=true;if(el.dataset.field.startsWith('items.'))updateTotals();}
 if(el.id==='query-text'){ui.draftQuery=el.value;if(E('pending-query'))E('pending-query').hidden=ui.draftQuery===ui.query&&ui.draftMonth===ui.month;}
 if(el.id.startsWith('case-')||el.id==='reply-text')ui.dirty=true;
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.select){if(el.checked)ui.selected.add(el.dataset.select);else ui.selected.delete(el.dataset.select);render();return;}
 if(el.id==='select-visible'){const ids=el.dataset.ids.split(',').filter(Boolean);ids.forEach(id=>el.checked?ui.selected.add(id):ui.selected.delete(id));render();return;}
 if(el.id==='query-month'){ui.draftMonth=el.value;E('pending-query').hidden=ui.draftMonth===ui.month&&ui.draftQuery===ui.query;return;}
 if(el.id==='preview-seller'){if(ui.dirty&&!window.confirm('작성 중인 내용을 버리고 가상 계정을 전환할까요?')){el.value=ui.seller;return;}ui.dirty=false;ui.seller=el.value;ui.replyFile=null;go('seller');return;}
 if(el.dataset.file){readFile(el.files[0],el.dataset.file).catch(err=>{console.error(err);toast('파일을 읽지 못했습니다. 다시 선택해 주세요.');});return;}
 if(el.dataset.field==='monthId'&&ui.form){const id=el.value;if(ui.dirty&&!window.confirm('입점사·공급월을 바꾸면 입력 중인 실제 결과가 초기화됩니다. 변경할까요?')){el.value=ui.form.monthId;return;}ui.form=blankForm(getM(id));ui.detail=id;ui.dirty=false;ui.errors={};render();return;}
 if(el.dataset.field==='kind'&&ui.form){ui.form.kind=el.value;ui.form.originalDoc=el.value==='correction'&&ui.form.monthId==='M07'?'D07-1':'';ui.form.caseId=el.value==='correction'&&ui.form.monthId==='M07'?'C07':'';ui.dirty=true;render();return;}
});
document.addEventListener('submit',e=>{if(e.target.id==='query-form'){e.preventDefault();ui.query=ui.draftQuery.trim();ui.month=ui.draftMonth;ui.filter='all';ui.pageNo=1;ui.selected.clear();render();}if(e.target.id==='seller-query'){e.preventDefault();const from=E('seller-from').value,to=E('seller-to').value;if(from&&to&&from>to)return toast('시작일은 종료일보다 늦을 수 없습니다.');Object.assign(ui,{sellerBasis:E('seller-basis').value,sellerFrom:from,sellerTo:to,sellerType:E('seller-type').value,sellerQuery:E('seller-search').value.trim()});render();}});
document.addEventListener('keydown',e=>{if(e.isComposing&&e.key==='Enter')e.stopPropagation();});
window.addEventListener('beforeunload',e=>{if(ui.dirty){e.preventDefault();e.returnValue='';}});
E('dialog').addEventListener('close',()=>{modalAction=null;});
window.addEventListener('popstate',()=>{const parts=location.hash.slice(1).split('/');if(ui.dirty&&!window.confirm('저장하지 않은 내용을 버리고 이전 화면으로 이동할까요?')){try{history.pushState(null,'','#'+ui.page+(ui.detail?'/'+ui.detail:''))}catch(e){}return;}ui.dirty=false;ui.historyNavigation=true;try{if(parts[0]==='register')startRegister(parts[1]);else if(parts[0]==='edit'&&getD(parts[1]))startRegister(parts[1],true);else go(parts[0]||'months',parts[1]||null,{force:true,restore:true});}finally{ui.historyNavigation=false;}});
function boot(){const route=location.hash.slice(1).split('/');const allowed=['months','docs','cases','inquiries','month','document','snapshot','case','inquiry','seller','seller-doc','seller-inquiry'];if(route[0]==='register'&&getM(route[1]))return startRegister(route[1]);if(allowed.includes(route[0])){ui.page=route[0];ui.detail=route[1]||null;}render();}
boot();
